name: Validar PR

# Valida o PR contra a org da branch de DESTINO, sem aplicar nada:
#   PR -> dev         valida na arnone-dev
#   PR -> uat         valida na arnone-uat
#   PR -> production  valida na arnone-prod (sempre com testes)
# Pega erro de metadado e falha de teste antes do merge.
on:
  pull_request:
    branches: [dev, uat, production]
    types: [opened, synchronize, reopened]
    paths:
      - "force-app/**"
      - "sfdx-project.json"

permissions:
  contents: read
  pull-requests: write

# Push novo no PR cancela a validacao anterior: so o ultimo commit importa.
concurrency:
  group: validate-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Dry-run na org de destino
    runs-on: ubuntu-latest
    # Repo publico: PR de fork nao recebe os secrets e falharia na autenticacao.
    if: github.event.pull_request.head.repo.full_name == github.repository
    env:
      ORG_ALIAS: >-
        ${{ github.base_ref == 'production' && 'arnone-prod'
         || github.base_ref == 'uat' && 'arnone-uat'
         || 'arnone-dev' }}
      SF_AUTH_URL: >-
        ${{ github.base_ref == 'production' && secrets.SF_AUTH_URL_PROD
         || github.base_ref == 'uat' && secrets.SF_AUTH_URL_UAT
         || secrets.SF_AUTH_URL_DEV }}
    steps:
      - name: Checkout com historico completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar Salesforce CLI e sfdx-git-delta
        run: |
          npm install --global @salesforce/cli@latest
          echo y | sf plugins install sfdx-git-delta@latest
          sf version

      - name: Autenticar na org de destino
        run: |
          if [ -z "$SF_AUTH_URL" ]; then
            echo "::error::Secret de autenticacao vazio para $ORG_ALIAS (base: ${{ github.base_ref }})."
            exit 1
          fi
          case "$SF_AUTH_URL" in
            force://*) ;;
            *) echo "::error::Secret de $ORG_ALIAS nao e uma auth URL valida (nao comeca com force://)."
               echo "::error::Gere com: sf org auth show-sfdx-auth-url --target-org <alias> --json | jq -r .result.sfdxAuthUrl"
               exit 1 ;;
          esac
          printf '%s' "$SF_AUTH_URL" > "$RUNNER_TEMP/auth_url.txt"
          sf org login sfdx-url --sfdx-url-file "$RUNNER_TEMP/auth_url.txt" \
            --alias "$ORG_ALIAS" --set-default
          rm -f "$RUNNER_TEMP/auth_url.txt"
          sf org display --target-org "$ORG_ALIAS" --json \
            | jq -r '"Org: \(.result.username) | \(.result.instanceUrl)"'

      - name: Calcular delta do PR
        id: delta
        run: |
          BASE_REF="${{ github.base_ref }}"
          git fetch --quiet origin "$BASE_REF"
          # HEAD aqui e o merge commit do PR: o delta e o estado pos-merge.
          FROM="$(git merge-base "origin/$BASE_REF" HEAD)"
          echo "from=$FROM" >> "$GITHUB_OUTPUT"
          echo "Delta: $FROM -> HEAD (destino: $ORG_ALIAS)"

          mkdir -p delta
          sf sgd source delta \
            --from "$FROM" \
            --to HEAD \
            --output-dir delta \
            --source-dir force-app \
            --ignore-whitespace \
            --ignore-file .forceignore

          echo "--- package.xml (a validar) ---"
          cat delta/package/package.xml

          if grep -q "<types>" delta/package/package.xml; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "Nenhum componente alterado no delta."
          fi

          # PR para producao sempre roda a bateria: e o ultimo portao antes da org
          # real. Nas outras branches, so quando o delta mexe em Apex — nao faz
          # sentido gastar minutos num PR que so mexe em layout ou relatorio.
          if [ "$BASE_REF" = "production" ]; then
            echo "test_level=RunLocalTests" >> "$GITHUB_OUTPUT"
          elif grep -qE "<name>(ApexClass|ApexTrigger)</name>" delta/package/package.xml; then
            echo "test_level=RunLocalTests" >> "$GITHUB_OUTPUT"
          else
            echo "test_level=NoTestRun" >> "$GITHUB_OUTPUT"
          fi

          if [ -f delta/destructiveChanges/destructiveChanges.xml ] \
             && grep -q "<types>" delta/destructiveChanges/destructiveChanges.xml; then
            echo "has_destructive=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_destructive=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validar deploy (dry-run)
        id: dryrun
        if: steps.delta.outputs.has_changes == 'true'
        run: |
          set +e
          sf project deploy start \
            --manifest delta/package/package.xml \
            --target-org "$ORG_ALIAS" \
            --test-level "${{ steps.delta.outputs.test_level }}" \
            --dry-run \
            --wait 60 \
            --verbose 2>&1 | tee "$RUNNER_TEMP/deploy.log"
          STATUS=${PIPESTATUS[0]}
          exit $STATUS

      - name: Comentar resultado no PR
        if: always() && steps.delta.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ steps.dryrun.outcome }}" = "success" ]; then
            ICONE="✅"; TITULO="Validação passou em \`$ORG_ALIAS\`"
          else
            ICONE="❌"; TITULO="Validação falhou em \`$ORG_ALIAS\`"
          fi

          {
            echo "<!-- validate-pr -->"
            echo "## $ICONE $TITULO"
            echo ""
            echo "Dry-run — **nada foi aplicado na org**."
            echo ""
            echo "- Destino: \`${{ github.base_ref }}\` → \`$ORG_ALIAS\`"
            echo "- Nível de teste: \`${{ steps.delta.outputs.test_level }}\`"
            echo "- Delta a partir de: \`${{ steps.delta.outputs.from }}\`"
            echo "- [Log completo do run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            echo ""
            echo "<details><summary>Componentes no delta</summary>"
            echo ""
            echo '```xml'
            cat delta/package/package.xml
            echo '```'
            echo ""
            echo "</details>"

            if [ "${{ steps.delta.outputs.has_destructive }}" = "true" ]; then
              echo ""
              echo "> [!WARNING]"
              echo "> Este PR remove metadados. As pipelines **não aplicam remoções**;"
              echo "> após o merge, o deploy destrutivo é manual e revisado."
              echo ""
              echo '```xml'
              cat delta/destructiveChanges/destructiveChanges.xml
              echo '```'
            fi

            if [ -f "$RUNNER_TEMP/deploy.log" ] && [ "${{ steps.dryrun.outcome }}" != "success" ]; then
              echo ""
              echo "<details open><summary>Erros</summary>"
              echo ""
              echo '```'
              tail -n 60 "$RUNNER_TEMP/deploy.log"
              echo '```'
              echo ""
              echo "</details>"
            fi
          } > "$RUNNER_TEMP/comment.md"

          PR="${{ github.event.pull_request.number }}"
          # Comentário fixo: edita o anterior em vez de empilhar um por push.
          gh pr comment "$PR" --body-file "$RUNNER_TEMP/comment.md" --edit-last \
            || gh pr comment "$PR" --body-file "$RUNNER_TEMP/comment.md"

      - name: Resumo
        if: always()
        run: |
          {
            echo "## Validação do PR #${{ github.event.pull_request.number }}"
            echo ""
            echo "- Destino: \`${{ github.base_ref }}\` → \`$ORG_ALIAS\`"
            echo "- Componentes alterados: ${{ steps.delta.outputs.has_changes }}"
            echo "- Nível de teste: ${{ steps.delta.outputs.test_level }}"
            echo "- Resultado: ${{ steps.dryrun.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"
