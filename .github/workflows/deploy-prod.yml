name: Deploy Producao

# Producao nunca sai de um merge automatico. Sao dois disparos manuais
# deliberados, no padrao recomendado pela Salesforce:
#
#   1. modo "validate"     -> valida na prod com RunLocalTests, sem aplicar,
#                             e devolve um job id valido por 10 dias
#   2. modo "quick-deploy"  -> aplica aquele job id ja validado, sem reexecutar
#                             os testes (deploy de minutos, nao de uma hora)
#
# O environment "production" esta declarado de proposito: no plano atual do repo
# o GitHub nao permite required reviewers em repo privado, mas ao subir para
# Pro/Team a aprovacao por revisor passa a valer sem mudar este arquivo.
on:
  workflow_dispatch:
    inputs:
      modo:
        description: "O que fazer"
        required: true
        default: "validate"
        type: choice
        options:
          - validate
          - quick-deploy
      from_ref:
        description: "[validate] commit/tag inicial do delta (vazio = tag prod)"
        required: false
        default: ""
        type: string
      test_level:
        description: "[validate] nivel de teste"
        required: false
        default: "RunLocalTests"
        type: choice
        options:
          - RunLocalTests
          - RunAllTestsInOrg
      job_id:
        description: "[quick-deploy] job id devolvido pela validacao"
        required: false
        default: ""
        type: string
      confirmacao:
        description: "[quick-deploy] digite DEPLOY PRODUCAO para confirmar"
        required: false
        default: ""
        type: string

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  prod:
    name: ${{ inputs.modo }} na arnone-prod
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write # move a tag prod depois do deploy
    steps:
      - name: Conferir confirmacao
        if: inputs.modo == 'quick-deploy'
        run: |
          if [ "${{ inputs.confirmacao }}" != "DEPLOY PRODUCAO" ]; then
            echo "::error::Confirmacao invalida. Para aplicar em producao, digite exatamente: DEPLOY PRODUCAO"
            exit 1
          fi
          if [ -z "${{ inputs.job_id }}" ]; then
            echo "::error::job_id obrigatorio no modo quick-deploy. Rode antes o modo validate."
            exit 1
          fi

      - name: Checkout com historico completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar Salesforce CLI e sfdx-git-delta
        run: |
          npm install --global @salesforce/cli@latest
          echo y | sf plugins install sfdx-git-delta@latest
          sf version

      - name: Autenticar na arnone-prod
        env:
          SF_AUTH_URL_PROD: ${{ secrets.SF_AUTH_URL_PROD }}
        run: |
          if [ -z "$SF_AUTH_URL_PROD" ]; then
            echo "::error::Secret SF_AUTH_URL_PROD nao configurado no environment production."
            exit 1
          fi
          printf '%s' "$SF_AUTH_URL_PROD" > "$RUNNER_TEMP/auth_url.txt"
          sf org login sfdx-url --sfdx-url-file "$RUNNER_TEMP/auth_url.txt" --alias arnone-prod --set-default
          rm -f "$RUNNER_TEMP/auth_url.txt"
          sf org display --target-org arnone-prod --json \
            | jq -r '"Org: \(.result.username) | \(.result.instanceUrl)"'

      # ---------------- modo validate ----------------

      - name: Calcular delta desde o ultimo deploy de producao
        id: delta
        if: inputs.modo == 'validate'
        run: |
          FROM="${{ inputs.from_ref }}"
          if [ -z "$FROM" ]; then
            # A tag "prod" marca o que ja esta em producao; e movida ao fim de
            # cada quick-deploy bem sucedido.
            if git rev-parse --verify --quiet "refs/tags/prod" >/dev/null; then
              FROM="prod"
            else
              echo "::error::Nao existe a tag 'prod' (nenhum deploy de producao feito por esta pipeline)."
              echo "::error::No primeiro uso, informe from_ref com o commit/tag que representa o estado atual da producao."
              exit 1
            fi
          fi
          if ! git cat-file -e "${FROM}^{commit}" 2>/dev/null; then
            echo "::error::from_ref '$FROM' nao existe neste repositorio."
            exit 1
          fi

          echo "from=$FROM" >> "$GITHUB_OUTPUT"
          echo "Delta: $FROM -> ${{ github.sha }}"

          mkdir -p delta
          sf sgd source delta \
            --from "$FROM" \
            --to "${{ github.sha }}" \
            --output-dir delta \
            --source-dir force-app \
            --ignore-whitespace

          echo "--- package.xml (a validar) ---"
          cat delta/package/package.xml

          if grep -q "<types>" delta/package/package.xml; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Nenhum componente alterado entre $FROM e ${{ github.sha }}. Nada a validar."
          fi

          if [ -f delta/destructiveChanges/destructiveChanges.xml ] \
             && grep -q "<types>" delta/destructiveChanges/destructiveChanges.xml; then
            echo "has_destructive=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_destructive=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validar na producao (sem aplicar)
        id: validacao
        if: inputs.modo == 'validate' && steps.delta.outputs.has_changes == 'true'
        run: |
          set +e
          # deploy validate (nao deploy start --dry-run): so ele produz um job id
          # que o deploy quick consegue aplicar depois.
          sf project deploy validate \
            --manifest delta/package/package.xml \
            --target-org arnone-prod \
            --test-level "${{ inputs.test_level }}" \
            --wait 120 \
            --json > "$RUNNER_TEMP/validacao.json"
          STATUS=$?
          set -e

          JOB_ID="$(jq -r '.result.id // empty' "$RUNNER_TEMP/validacao.json")"
          echo "job_id=$JOB_ID" >> "$GITHUB_OUTPUT"

          if [ "$STATUS" -ne 0 ]; then
            echo "--- falhas ---"
            jq -r '
              (.result.details.componentFailures // .data.details.componentFailures // [])[]
              | "\(.componentType) \(.fullName): \(.problem)"
            ' "$RUNNER_TEMP/validacao.json" 2>/dev/null | head -n 40
            jq -r '
              (.result.details.runTestResult.failures // [])[]
              | "TESTE \(.name).\(.methodName): \(.message)"
            ' "$RUNNER_TEMP/validacao.json" 2>/dev/null | head -n 40
          fi
          exit $STATUS

      # ---------------- modo quick-deploy ----------------

      - name: Aplicar deploy validado na producao
        id: quick
        if: inputs.modo == 'quick-deploy'
        run: |
          sf project deploy quick \
            --job-id "${{ inputs.job_id }}" \
            --target-org arnone-prod \
            --wait 120 \
            --verbose

      - name: Marcar o commit deployado com a tag prod
        if: inputs.modo == 'quick-deploy' && steps.quick.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f prod "${{ github.sha }}"
          git push -f origin "refs/tags/prod"
          echo "Tag prod movida para ${{ github.sha }}"

      # ---------------- resumo ----------------

      - name: Resumo
        if: always()
        run: |
          {
            echo "## Producao — modo \`${{ inputs.modo }}\`"
            echo ""
            if [ "${{ inputs.modo }}" = "validate" ]; then
              echo "- Delta: \`${{ steps.delta.outputs.from }}\` → \`${{ github.sha }}\`"
              echo "- Nível de teste: \`${{ inputs.test_level }}\`"
              echo "- Componentes alterados: ${{ steps.delta.outputs.has_changes }}"
              echo "- Resultado: ${{ steps.validacao.outcome }}"
              if [ "${{ steps.validacao.outcome }}" = "success" ] \
                 && [ -n "${{ steps.validacao.outputs.job_id }}" ]; then
                echo ""
                echo "> [!IMPORTANT]"
                echo "> Validação aprovada. Para aplicar em produção, rode este workflow de novo"
                echo "> **no mesmo ref**, com:"
                echo "> - \`modo\`: \`quick-deploy\`"
                echo "> - \`job_id\`: \`${{ steps.validacao.outputs.job_id }}\`"
                echo "> - \`confirmacao\`: \`DEPLOY PRODUCAO\`"
                echo ">"
                echo "> O job id vale por 10 dias e aplica sem reexecutar os testes."
              fi
              if [ -f delta/package/package.xml ]; then
                echo ""
                echo "<details><summary>package.xml validado</summary>"
                echo ""
                echo '```xml'
                cat delta/package/package.xml
                echo '```'
                echo ""
                echo "</details>"
              fi
              if [ "${{ steps.delta.outputs.has_destructive }}" = "true" ]; then
                echo ""
                echo "> [!WARNING]"
                echo "> Há remoções de metadados neste delta. Elas **não foram validadas nem aplicadas**."
                echo "> Deploy destrutivo em produção é manual e revisado."
                echo ""
                echo '```xml'
                cat delta/destructiveChanges/destructiveChanges.xml
                echo '```'
              fi
            else
              echo "- Job id aplicado: \`${{ inputs.job_id }}\`"
              echo "- Commit: \`${{ github.sha }}\`"
              echo "- Resultado: ${{ steps.quick.outcome }}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
